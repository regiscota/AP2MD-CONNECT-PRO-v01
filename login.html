<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - AP2MD CONNECT PRO</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0b5ed7, #198754);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.20);
            text-align: center;
        }

        .logo-box {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            background: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            overflow: hidden;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 {
            color: #0b5ed7;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 17px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #0b5ed7;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #0b5ed7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #084298;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }

        footer {
            margin-top: 25px;
            color: #6b7280;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo-box">
        <img
            src="./assets/logo-ap2md-officiel-2.png"
            alt="Logo officiel AP2MD-Douké"
        >
    </div>

    <h1>AP2MD CONNECT PRO</h1>

    <p class="subtitle">
        Espace sécurisé de gestion et de suivi-évaluation
    </p>

    <form id="loginForm">

        <label for="email">Adresse e-mail</label>

        <input
            type="email"
            id="email"
            placeholder="Votre adresse e-mail"
            required
        >

        <label for="password">Mot de passe</label>

        <input
            type="password"
            id="password"
            placeholder="Votre mot de passe"
            required
        >

        <button type="submit">
            Se connecter
        </button>

    </form>

    <div id="message"></div>

    <footer>
        AP2MD-Douké
    </footer>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const message = document.getElementById("message");

    if (!email || !password) {
        message.textContent = "Veuillez remplir tous les champs.";
        message.style.color = "red";
        return;
    }

    message.textContent = "Connexion en cours...";
    message.style.color = "#0b5ed7";
});
</script>

</body>
</html>
