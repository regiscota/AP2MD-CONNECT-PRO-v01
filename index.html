<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - AP2MD CONNECT PRO</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0b5ed7, #198754);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.20);
            text-align: center;
        }

        .logo-box {
            width: 125px;
            height: 125px;
            margin: 0 auto 18px;
            background: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            overflow: hidden;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            display: block;
        }

        h1 {
            color: #0b5ed7;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .field {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #0b5ed7;
            box-shadow: 0 0 0 3px rgba(11,94,215,0.10);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #0b5ed7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #084298;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #message {
            min-height: 22px;
            margin-top: 16px;
            font-size: 14px;
        }

        footer {
            margin-top: 25px;
            color: #6b7280;
            font-size: 12px;
            line-height: 1.5;
        }

        @media (max-width: 500px) {
            .login-box {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo-box">
        <img
            src="./assets/logo-ap2md-officiel-2.png"
            alt="Logo officiel AP2MD-Douké"
        >
    </div>

    <h1>AP2MD CONNECT PRO</h1>

    <p class="subtitle">
        Espace sécurisé de gestion, de suivi-évaluation
        et de pilotage des projets AP2MD-Douké
    </p>

    <form id="loginForm">

        <div class="field">
            <label for="email">Adresse e-mail</label>

            <input
                type="email"
                id="email"
                placeholder="Votre adresse e-mail"
                required
            >
        </div>

        <div class="field">
            <label for="password">Mot de passe</label>

            <input
                type="password"
                id="password"
                placeholder="Votre mot de passe"
                required
            >
        </div>

        <button type="submit" id="loginButton">
            Se connecter
        </button>

    </form>

    <div id="message"></div>

    <footer>
        AP2MD-Douké<br>
        Plateforme AP2MD CONNECT PRO
    </footer>

</div>

<script type="module">

    import { createClient } from
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
        "https://pturkucczqqioivapjcr.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_GO8o-jJp97DG0poviRApzQ_v3CgaqRT";

    const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    const loginForm =
        document.getElementById("loginForm");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const loginButton =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");


    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        if (!email || !password) {

            message.textContent =
                "Veuillez remplir tous les champs.";

            message.style.color = "#dc3545";

            return;
        }

        loginButton.disabled = true;

        loginButton.textContent =
            "Connexion...";

        message.textContent = "";


        try {

            const { data, error } =
                await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                message.textContent =
                    "Échec de connexion : " +
                    error.message;

                message.style.color =
                    "#dc3545";

                loginButton.disabled = false;

                loginButton.textContent =
                    "Se connecter";

                return;
            }


            if (data.user) {

                message.textContent =
                    "Connexion réussie. Ouverture de votre espace...";

                message.style.color =
                    "#198754";

                setTimeout(function() {

                    window.location.href =
                        "./dashboard.html";

                }, 800);
            }

        } catch (error) {

            message.textContent =
                "Une erreur est survenue pendant la connexion.";

            message.style.color =
                "#dc3545";

            loginButton.disabled = false;

            loginButton.textContent =
                "Se connecter";
        }

    });

</script>

</body>
</html>
